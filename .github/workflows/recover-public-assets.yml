name: Recover Cloudflare Pages public assets
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recover-public-assets.yml"
      - "recovery/download_public_assets.py"
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download 9 public assets from 4 deployments
        run: python3 recovery/download_public_assets.py
      - name: Validate recovered assets and prohibit privileged keys
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('recovery_artifacts')
          m = json.loads((root/'manifest.json').read_text())
          assert len(m) == 36 and all(x['ok'] for x in m), 'Recovery incomplete'
          for version in ['production','8fa9c30b','4dd8d2d4','7f79fb8a']:
              config = (root/version/'config.js').read_text()
              for forbidden in ['service_role', 'sb_secret_', 'BEGIN PRIVATE KEY']:
                  assert forbidden.lower() not in config.lower(), 'Privileged secret marker found'
          print('Validated all 36 assets, no privileged config key markers')
          PY
      - name: Keep permanent snapshots inside this repository
        run: |
          mkdir -p recovered_snapshots
          cp -a recovery_artifacts/. recovered_snapshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovered_snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "backup: preserve four Cloudflare Pages deployed snapshots"
            git push
          else
            echo "Snapshots already up to date"
          fi
      - name: Upload snapshot as downloadable ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-recovery
          path: recovery_artifacts/
          retention-days: 7
          if-no-files-found: warn
