name: Validate and package 112191 WORK v2.5
on:
  workflow_dispatch:
  push:
    branches:
      - feature/quan-ly-tai-khoan-v21
    paths:
      - candidate_v21/**
      - .github/workflows/validate-v21.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Copy verified original app icons
        run: |
          cp recovered_snapshots/production/icon-192.png candidate_v21/icon-192.png
          cp recovered_snapshots/production/icon-512.png candidate_v21/icon-512.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate_v21/icon-192.png candidate_v21/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "build: preserve icons in v2.5 preview"
            git push
          fi
      - name: JavaScript syntax check
        run: node --check candidate_v21/app.js && node --check candidate_v21/sw.js && node --check candidate_v21/config.js
      - name: Feature and permission regression checks
        run: |
          node candidate_v21/test_smoke.mjs
          node candidate_v21/test_sw_push.mjs
      - name: Verify deployed Push endpoint rejects anonymous access and allows CORS
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 25 -D /tmp/push-cors.txt -o /dev/null -X OPTIONS \
            'https://oyjrgbpjrazwvmiomquw.supabase.co/functions/v1/work-push' \
            -H 'Origin: https://112191work.pages.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type'
          grep -iq 'access-control-allow-origin: https://112191work.pages.dev' /tmp/push-cors.txt
          status="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' \
            -X POST 'https://oyjrgbpjrazwvmiomquw.supabase.co/functions/v1/work-push' \
            -H 'content-type: application/json' \
            --data '{"action":"dispatch_task"}')"
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            echo "Unauthenticated Push endpoint response unsafe: $status"
            exit 1
          fi
          echo "Push endpoint rejects unauthorized operations: HTTP $status"
      - name: Set up Deno for privileged backend type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function TypeScript syntax and types
        run: |
          deno check candidate_v21/supabase/functions/manage-staff/index.ts
          deno check candidate_v21/supabase/functions/work-push/index.ts
          deno check candidate_v21/supabase/functions/manage-tasks/index.ts
      - name: Check required features and prevent secrets in frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('candidate_v21/app.js').read_text()
          assert 'Công Việc Siêu Thị' in app
          assert 'function accountsView' in app
          assert 'function staffAdminRequest' in app
          assert 'createStaffForm' in app
          assert 'data-action="reset-staff-password"' in app
          html = Path('candidate_v21/index.html').read_text()
          assert 'app.js?v=2.5' in html
          assert 'styles.css?v=2.5' in html
          assert not Path('candidate_v21/config.js').read_text().find('sb_secret_') >= 0
          print('Frontend checks passed')
          PY
      - name: Package public frontend only (exclude Supabase backend)
        run: |
          mkdir -p deploy_site
          for filename in app.js index.html styles.css config.js sw.js manifest.webmanifest robots.txt icon-192.png icon-512.png; do
            cp "candidate_v21/$filename" "deploy_site/$filename"
          done
          test "$(find deploy_site -maxdepth 1 -type f | wc -l)" -eq 9
      - name: Upload site-only ZIP for Preview deployment
        uses: actions/upload-artifact@v4
        with:
          name: 112191-work-v25-site-only
          path: deploy_site/
          retention-days: 14
