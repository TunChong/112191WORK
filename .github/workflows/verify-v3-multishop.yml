name: Verify 112191 WORK v3 multi-SHOP foundation
on:
  workflow_dispatch:
  push:
    branches: [feature/v3-multi-shop-500]
    paths:
      - 'candidate_v21/**'
      - '.github/workflows/verify-v3-multishop.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check privileged Edge Function
        run: |
          deno check candidate_v21/supabase/functions/manage-shops/index.ts
          deno check candidate_v21/supabase/functions/manage-staff/index.ts
      - name: Ensure write operations cannot run before isolation
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const code=fs.readFileSync('candidate_v21/supabase/functions/manage-shops/index.ts','utf8');
          const sql=fs.readFileSync('candidate_v21/supabase/migrations/20261115_v3_phase1_multishop.sql','utf8');
          assert.match(code,/if\(!await enabled\(\)\)return answer\(req,423/);
          assert.match(code,/work_multi_shop_config/);
          assert.match(code,/signed=await api\('\/auth\/v1\/user'/);
          assert.match(code,/if\(!managerFor\(shop\)\)/);
          assert.match(code,/if\(!isAdmin\)return answer\(req,403/);
          assert.doesNotMatch(code,/Deno\.env\.get\('SUPABASE_SERVICE_ROLE_KEY'\).*return answer/);
          assert.match(sql,/work_shops ENABLE ROW LEVEL SECURITY/);
          assert.match(sql,/work_shop_memberships ENABLE ROW LEVEL SECURITY/);
          console.log('PASS: scoped management, protected writes and RLS foundations');
          JS
      - name: Verify frontend syntax and legacy regression tests
        run: |
          node --check candidate_v21/app.js
          node candidate_v21/test_smoke.mjs
          node candidate_v21/test_sw_push.mjs
