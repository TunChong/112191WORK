name: Verify 112191 WORK v3 multi-SHOP foundation
on:
  workflow_dispatch:
  push:
    branches: [feature/v3-multi-shop-500]
    paths:
      - 'candidate_v21/**'
      - '.github/workflows/verify-v3-multishop.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check privileged Edge Function
        run: |
          deno check candidate_v21/supabase/functions/manage-shops/index.ts
          deno check candidate_v21/supabase/functions/manage-staff/index.ts
          deno check candidate_v21/supabase/functions/work-push/index.ts
          deno check candidate_v21/supabase/functions/quote-product/index.ts
          node --check candidate_v21/quote40.js
          node --check candidate_v21/audio40.js
          node --check candidate_v21/inventory40.js
      - name: Ensure write operations cannot run before isolation
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const code=fs.readFileSync('candidate_v21/supabase/functions/manage-shops/index.ts','utf8');
          const sql=fs.readFileSync('candidate_v21/supabase/migrations/20261115_v3_phase1_multishop.sql','utf8');
          assert.match(code,/if\(!await enabled\(\)\)return answer\(req,423/);
          assert.match(code,/work_multi_shop_config/);
          assert.match(code,/signed=await api\('\/auth\/v1\/user'/);
          assert.match(code,/if\(!managerFor\(shop\)\)/);
          assert.match(code,/if\(!isAdmin\)return answer\(req,403/);
          assert.doesNotMatch(code,/Deno\.env\.get\('SUPABASE_SERVICE_ROLE_KEY'\).*return answer/);
          assert.match(sql,/work_shops ENABLE ROW LEVEL SECURITY/);
          assert.match(sql,/work_shop_memberships ENABLE ROW LEVEL SECURITY/);
          console.log('PASS: scoped management, protected writes and RLS foundations');
          JS
      - name: Verify frontend syntax and legacy regression tests
        run: |
          node --check candidate_v21/app.js
          node candidate_v21/test_smoke.mjs
          node candidate_v21/test_sw_push.mjs
          node candidate_v21/test_multishop_ui.mjs
          node candidate_v21/test_inventory40.mjs
          node candidate_v21/test_inventory40_one_scan.mjs
          node candidate_v21/test_shop_delete_direct.mjs
          node candidate_v21/test_login_no_suggestions.mjs
          node candidate_v21/test_quote40.mjs
          node candidate_v21/test_audio40.mjs
          node candidate_v21/test_quote_inventory_323.mjs

      - name: Package Cloudflare PREVIEW assets only
        run: |
          mkdir -p deploy_site
          for filename in app.js index.html styles.css config.js sw.js manifest.webmanifest robots.txt icon-192.png icon-512.png inventory40.js inventory40.css quote40.js quote40.css quote_stores.js audio40.js audio40.css; do
            cp "candidate_v21/$filename" "deploy_site/$filename"
          done
          test "$(find deploy_site -maxdepth 1 -type f | wc -l)" -eq 16
      - name: Upload PREVIEW ZIP contents (not Production)
        uses: actions/upload-artifact@v4
        with:
          name: 112191-WORK-v3-multishop-PREVIEW
          path: deploy_site/
          retention-days: 14
