name: Deploy 112191 WORK v2.1 to Cloudflare Production
run-name: Release v2.1 to 112191work.pages.dev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 112191work-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy exact nine static assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audited release branch
        uses: actions/checkout@v4
        with:
          ref: feature/quan-ly-tai-khoan-v21
          persist-credentials: false

      - name: Verify frontend before release
        run: |
          node --check candidate_v21/app.js
          node candidate_v21/test_smoke.mjs

      - name: Verify real Supabase admin API denies anonymous callers
        shell: bash
        run: |
          status="$(curl --connect-timeout 10 --max-time 30 -sS \
            -o /tmp/manage-staff-response.txt \
            -w '%{http_code}' \
            -X POST 'https://oyjrgbpjrazwvmiomquw.supabase.co/functions/v1/manage-staff' \
            -H 'content-type: application/json' \
            --data '{"action":"list"}')"
          if [[ "$status" != "401" && "$status" != "403" ]]; then
            echo "Unsafe/unexpected anonymous response: HTTP $status"
            exit 1
          fi
          echo "Manager-only endpoint denies anonymous requests: HTTP $status"

      - name: Prepare site-only upload (never publish backend files)
        shell: bash
        run: |
          mkdir -p dist
          cp candidate_v21/index.html dist/
          cp candidate_v21/app.js dist/
          cp candidate_v21/styles.css dist/
          cp candidate_v21/config.js dist/
          cp candidate_v21/sw.js dist/
          cp candidate_v21/manifest.webmanifest dist/
          cp candidate_v21/robots.txt dist/
          cp candidate_v21/icon-192.png dist/
          cp candidate_v21/icon-512.png dist/
          [[ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 9 ]]
          test -s dist/index.html
          test -s dist/config.js
          ! grep -rEi 'service[_-]?role|SUPABASE_SERVICE_ROLE_KEY' dist

      - name: Require restricted Cloudflare deployment credential
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "Cloudflare API token is not configured; production has NOT been changed."
            exit 1
          fi

      - name: Deploy existing Pages project (main/Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2f9ff78348392c12b34451eb3ca3cf38
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=112191work \
            --branch=main

      - name: Verify production responds
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 \
            'https://112191work.pages.dev/' \
            | grep -F '<title>112191 WORK</title>'
          echo "Production HTML is available."
